<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Carlsbad 3D Explorer — What's Coming?</title>
<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:#f6f7f5;color:#182b29}header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid #dce4e1}header a{color:#175e56;text-decoration:none;font-weight:700}h1{font-size:1.1rem;margin:0}.toolbar{padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff}.toolbar button,.toolbar input{font:inherit;padding:10px;border:1px solid #b8c8c2;border-radius:8px;background:white}.toolbar button{cursor:pointer}.toolbar button[aria-pressed=true]{background:#175e56;color:white}.toolbar form{display:flex;flex:1;min-width:240px;gap:6px}.toolbar input{flex:1;min-width:0}#map{height:calc(100dvh - 165px);min-height:390px}#status{font-size:.85rem;padding:8px 16px;background:#f6f7f5}#status:focus{outline:2px solid #175e56}.maplibregl-popup-content{font:14px system-ui} @media(max-width:640px){header{align-items:flex-start}h1{font-size:1rem}#map{height:calc(100dvh - 220px);min-height:350px}.toolbar{gap:6px}.toolbar button{font-size:.9rem}}
</style></head><body>
<header><h1>Carlsbad 3D Explorer <small style="font-weight:400">Prototype</small></h1><a href="./">← Back to catalog</a></header>
<div class="toolbar"><button type="button" id="all" aria-pressed="true">All activity</button><button type="button" id="restaurants" aria-pressed="false">Restaurants</button><button type="button" id="housing" aria-pressed="false">Housing</button><form id="search"><input id="address" aria-label="Carlsbad address" placeholder="Find an address in Carlsbad" required><button type="submit">Find</button></form></div>
<div id="status" role="status" aria-live="polite">Loading 3D basemap. Property highlights require verified building footprints and coordinates.</div><div id="map" aria-label="Interactive 3D map of Carlsbad"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
const status=document.getElementById('status');
const map=new maplibregl.Map({container:'map',style:'https://demotiles.maplibre.org/style.json',center:[-117.3506,33.1581],zoom:15,pitch:58,bearing:-20,antialias:true});
map.addControl(new maplibregl.NavigationControl(),'top-right');
map.on('load',()=>{
  const style=map.getStyle();
  const candidate=Object.entries(style.sources||{}).find(([,s])=>s.type==='vector');
  if(candidate){
    const [sourceId]=candidate;
    const layers=(style.layers||[]).filter(l=>l['source-layer']==='building');
    if(layers.length){
      map.addLayer({id:'explorer-buildings-3d',type:'fill-extrusion',source:sourceId,'source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#8aa69d','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],12],'fill-extrusion-base':0,'fill-extrusion-opacity':0.75}});
      status.textContent='3D buildings available. Property-level activity highlighting is not yet connected.';
    }else status.textContent='Basemap loaded; this tile style has no compatible building layer. No property footprints are being inferred.';
  }else status.textContent='Basemap loaded without a compatible vector building source.';
});
map.on('error',e=>{status.textContent='Map tiles could not load. Check network access or the tile provider.';console.error(e.error)});
document.querySelectorAll('.toolbar>button').forEach(button=>button.addEventListener('click',()=>{
 document.querySelectorAll('.toolbar>button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 status.textContent=button.id==='all'?'All activity selected. Verified property coordinates are not yet connected.':button.textContent+' selected. Category-specific 3D highlights require matched property geometries.';
}));
let marker;
document.getElementById('search').addEventListener('submit',async e=>{
 e.preventDefault();const q=document.getElementById('address').value.trim();if(!q)return;
 status.textContent='Looking up address…';
 try{
  const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q+', Carlsbad, California');
  const response=await fetch(url,{headers:{Accept:'application/json'}});if(!response.ok)throw Error('Geocoding unavailable');
  const results=await response.json();if(!results.length)throw Error('Address not found');
  const p=results[0],lat=Number(p.lat),lon=Number(p.lon);
  if(lat<33.06||lat>33.21||lon< -117.43||lon> -117.22)throw Error('Address is outside the Carlsbad search area');
  if(marker)marker.remove();marker=new maplibregl.Marker({color:'#df6c32'}).setLngLat([lon,lat]).addTo(map);
  map.flyTo({center:[lon,lat],zoom:17,pitch:60});status.textContent='Address located. Nearby-development search will be enabled when records have verified coordinates.';
 }catch(err){status.textContent=err.message||'Address search failed';}
});
</script></body></html>
